version: '3.8'

services:
  db:
     image: postgis/postgis:16-3.4
     container_name: yer_izi_cbs_db
     environment:
       POSTGRES_DB: yer_izi_cbs
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: password
     ports:
       - "5432:5432"
     volumes:
       - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
